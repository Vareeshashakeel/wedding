<style>
/* Layout: one-screen embossed envelope (tap seal) → seal splits, flaps fold, petals fall → scrolling letterpress card */
:root{
  --paper:#f6f1e7;
  --paper-hi:#fffdf8;
  --paper-lo:#e6dccb;
  --ink:#5a4a36;
  --ink-soft:#8a7860;
  --gold:#b8914a;
  --gold-hi:#e9c77b;
  --glow:#ffd88a;
  --wax:#efe6d4;
  --wa:#1f8f5a;
  --f-script:"Pinyon Script","Great Vibes",cursive;
  --f-serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-caps:"Cinzel","Trajan Pro",Georgia,serif;
  --f-urdu:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-serif);font-size:18px;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button{font:inherit}
[hidden]{display:none!important}

/* ---------- ENVELOPE STAGE ---------- */
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,26px);
  background:radial-gradient(120% 80% at 50% 40%,#efe7d8,#d6c8ae);z-index:5;transition:opacity 1.1s ease .1s;overflow:hidden}
.stage.gone{opacity:0;pointer-events:none}
.forline{font-family:var(--f-caps);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft);text-align:center;transition:opacity .4s}
.forline b{display:block;font-family:var(--f-script);font-weight:400;font-size:clamp(30px,8vw,40px);letter-spacing:0;text-transform:none;color:var(--gold);margin-top:2px}
.env{position:relative;width:min(84vw,380px,48vh);aspect-ratio:9/16;max-width:100%;border-radius:6px;perspective:1400px;
  box-shadow:0 30px 60px -20px rgba(70,50,20,.45),0 8px 18px rgba(70,50,20,.18);
  animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(-.4deg)}}
.open.env{animation:none}
.base{position:absolute;inset:0;border-radius:6px;overflow:hidden;
  background:radial-gradient(60% 34% at 50% 50%,var(--glow) 0%,rgba(255,216,138,.55) 30%,rgba(246,241,231,0) 72%),linear-gradient(90deg,var(--paper-lo),var(--paper) 30%,var(--paper) 70%,var(--paper-lo))}
.beam{position:absolute;left:50%;top:0;bottom:0;width:22%;transform:translateX(-50%);
  background:radial-gradient(50% 50% at 50% 50%,rgba(255,236,190,.95),rgba(255,216,138,0) 70%);mix-blend-mode:screen;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55;transform:translateX(-50%) scaleY(.92)}}
.base svg,.flap svg{position:absolute;inset:0;width:100%;height:100%}
.sparkle{position:absolute;width:10px;height:10px;pointer-events:none;
  background:radial-gradient(circle,#fff 0 18%,transparent 20%),linear-gradient(0deg,transparent 45%,#fff 50%,transparent 55%),linear-gradient(90deg,transparent 45%,#fff 50%,transparent 55%);
  animation:twinkle 2.6s ease-in-out infinite;opacity:0}
@keyframes twinkle{40%,60%{opacity:1;transform:scale(1.3) rotate(45deg)}}

.flapwrap{position:absolute;inset:0;filter:drop-shadow(0 3px 5px rgba(90,65,25,.28));transition:transform 1.3s cubic-bezier(.6,.05,.25,1) .25s,opacity .6s ease 1.1s;transform-style:preserve-3d}
.flapwrap.top{transform-origin:50% 0}
.flapwrap.bot{transform-origin:50% 100%}
.flap{position:absolute;inset:0;background:linear-gradient(180deg,var(--paper-hi),var(--paper) 70%,#efe5d2)}
.top .flap{clip-path:polygon(0 0,100% 0,50% 47%);border-radius:6px 6px 0 0}
.bot .flap{clip-path:polygon(0 100%,100% 100%,50% 53%);background:linear-gradient(0deg,var(--paper-hi),var(--paper) 70%,#efe5d2)}

/* seal: two halves that split apart */
.seal{position:absolute;left:50%;top:50%;width:28%;aspect-ratio:1;transform:translate(-50%,-50%);border:0;padding:0;cursor:pointer;background:none;z-index:3}
.seal .half{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#fffaf0,var(--wax) 45%,#d6c7aa 100%);
  box-shadow:0 4px 10px rgba(80,55,20,.35),inset 0 -3px 6px rgba(120,95,55,.25),inset 0 2px 3px #fff;
  display:grid;place-items:center;transition:transform .9s cubic-bezier(.5,-0.3,.3,1.2),opacity .5s ease .45s}
.seal .half::after{content:"";position:absolute;inset:12%;border-radius:50%;border:1px solid rgba(150,120,70,.35);box-shadow:inset 0 1px 2px rgba(120,90,40,.35),0 1px 0 #fff}
.seal .l{clip-path:polygon(0 0,52% 0,46% 30%,54% 52%,45% 75%,52% 100%,0 100%)}
.seal .r{clip-path:polygon(52% 0,100% 0,100% 100%,52% 100%,45% 75%,54% 52%,46% 30%)}
.seal .mono{font-family:var(--f-script);font-size:clamp(20px,6.2vw,30px);color:#9c8256;text-shadow:0 1px 0 #fff,0 -1px 0 rgba(110,80,30,.35);line-height:1;position:relative;z-index:1}
.seal:focus-visible{outline:2px solid var(--gold);outline-offset:8px;border-radius:50%}
.seal .pulse{position:absolute;inset:-14%;border-radius:50%;border:1.5px solid rgba(255,232,175,.95);animation:ring 2.2s ease-out infinite;pointer-events:none}
@keyframes ring{from{transform:scale(.85);opacity:.9}to{transform:scale(1.5);opacity:0}}

.hint{font-family:var(--f-caps);font-size:12px;letter-spacing:.32em;color:var(--ink-soft);text-transform:uppercase;transition:opacity .4s;display:flex;align-items:center;gap:10px}
.hint i{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:tap 1.4s ease-in-out infinite}
@keyframes tap{50%{transform:scale(1.8);opacity:.3}}
.flash{position:fixed;inset:0;background:radial-gradient(circle at 50% 50%,rgba(255,248,228,1) 0%,rgba(255,228,165,.85) 30%,rgba(255,228,165,0) 70%);opacity:0;pointer-events:none;transition:opacity .8s ease;z-index:6}

/* opening sequence */
.open .seal .l{transform:translate(-38%,6%) rotate(-28deg);opacity:0}
.open .seal .r{transform:translate(38%,6%) rotate(28deg);opacity:0}
.open .seal .pulse{display:none}
.open .seal .mono{opacity:0;transform:scale(1.4);transition:opacity .35s,transform .5s}
.open .flapwrap.top{transform:rotateX(-178deg);opacity:0}
.open .flapwrap.bot{transform:rotateX(178deg);opacity:0}
.stage.opening .hint,.stage.opening .forline{opacity:0}
.flash.on{opacity:1;transition-delay:.8s}

/* ---------- INVITATION ---------- */
.invite{position:relative;min-height:100%;padding-block:clamp(28px,6vh,64px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(80% 40% at 50% 0%,rgba(255,224,160,.35),transparent 70%),var(--paper)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:7}
.card{position:relative;z-index:1;max-width:560px;margin:0 auto;background:var(--paper-hi);border-radius:4px;padding:clamp(30px,7vw,56px) clamp(20px,6vw,52px);text-align:center;
  box-shadow:0 1px 0 #fff inset,0 24px 50px -24px rgba(90,65,25,.35),0 2px 8px rgba(90,65,25,.08)}
.card::before{content:"";position:absolute;inset:10px;border:1px solid rgba(184,145,74,.45);border-radius:2px;pointer-events:none}
.card::after{content:"";position:absolute;inset:15px;border:1px solid rgba(184,145,74,.2);pointer-events:none}
.card > *{position:relative}
.card .rv{opacity:0;transform:translateY(16px)}
.revealed .card .rv{opacity:1;transform:none;transition:opacity 1s ease var(--d,0s),transform 1.1s cubic-bezier(.2,.7,.2,1) var(--d,0s)}
.ornament{width:min(220px,60%);height:auto;margin:0 auto;display:block}
.dear{font-family:var(--f-script);font-size:clamp(30px,8vw,38px);color:var(--ink);margin:10px 0 0}
.bismillah{font-family:var(--f-urdu);font-size:20px;color:var(--gold);margin:8px 0 2px;line-height:2.2}
.eyebrow{font-family:var(--f-caps);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 10px}
.names{font-family:var(--f-script);font-weight:400;font-size:clamp(52px,14vw,82px);line-height:1.05;margin:6px 0;
  background:linear-gradient(100deg,#a07a38 10%,var(--gold-hi) 45%,#a07a38 60%,#c9a35a 90%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--gold);animation:shimmer 6s linear infinite;text-wrap:balance}
.names .amp{display:block;font-size:.5em;line-height:1.1}
@keyframes shimmer{to{background-position:-220% 0}}
.parents{font-style:italic;color:var(--ink-soft);font-size:17px;line-height:1.5;max-width:34ch;margin:0 auto}
.lead{font-size:19px;line-height:1.55;max-width:32ch;margin:16px auto 0}
.date{display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,18px);margin:26px 0 8px;font-family:var(--f-caps);color:var(--ink)}
.date .side{font-size:13px;letter-spacing:.2em;text-transform:uppercase;border-block:1px solid rgba(184,145,74,.5);padding:6px 0;min-width:86px}
.date .day{font-size:clamp(46px,12vw,60px);line-height:1;color:var(--gold)}
.year{font-family:var(--f-caps);letter-spacing:.4em;font-size:13px;color:var(--ink-soft)}

.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:340px;margin:28px auto 6px}
.count div{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-radius:3px;background:linear-gradient(180deg,#fbf6ec,#f3ebdb)}
.count b{font-family:var(--f-caps);font-weight:500;font-size:24px;font-variant-numeric:tabular-nums;color:var(--ink)}
.count small{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft)}
.count-label{font-style:italic;color:var(--ink-soft);font-size:15px;margin:0}

.rule{display:flex;align-items:center;gap:12px;margin:34px 0 18px;color:var(--gold)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(184,145,74,.6),transparent)}

.events{display:grid;gap:14px}
.event{padding:20px 14px 16px;border-radius:3px;border:1px solid rgba(184,145,74,.28);background:rgba(255,250,240,.6)}
.event h3{font-family:var(--f-script);font-weight:400;font-size:42px;line-height:1;margin:0 0 6px;color:var(--gold)}
.event p{margin:2px 0;line-height:1.45}
.event .when{font-family:var(--f-caps);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.event .where{font-style:italic;color:var(--ink-soft)}
.links{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 18px;margin-top:10px}
.links a,.textlink{font-family:var(--f-caps);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:40px;text-decoration:none;cursor:pointer;
  font-family:var(--f-caps);font-size:12px;letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--gold);color:var(--paper-hi);
  background:linear-gradient(180deg,#c9a35a,#a8823f);box-shadow:0 6px 16px -6px rgba(140,100,40,.6)}
.btn.wa{background:linear-gradient(180deg,#25a768,var(--wa));border-color:var(--wa);box-shadow:0 6px 16px -6px rgba(20,110,60,.55)}
.btn.ghost{background:none;color:var(--ink-soft);border-color:rgba(184,145,74,.5);box-shadow:none}
.btn svg{width:18px;height:18px;fill:currentColor}
a:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.rsvp{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:6px}
.rsvp p{margin:0;font-style:italic;color:var(--ink-soft)}

.closing{margin-top:30px;font-size:18px;line-height:1.6}
.closing .sign{font-family:var(--f-script);font-size:34px;color:var(--gold);display:block;margin-top:4px}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:24px}

/* host panel: make a personal link per guest (open with #send) */
.host{position:relative;z-index:1;max-width:560px;margin:22px auto 0;padding:22px clamp(16px,5vw,30px);border-radius:4px;background:#fffaf0;border:1px dashed rgba(184,145,74,.6);text-align:left}
.host h2{font-family:var(--f-caps);font-weight:500;font-size:15px;letter-spacing:.2em;text-transform:uppercase;margin:0 0 6px}
.host p{margin:0 0 12px;color:var(--ink-soft);font-size:16px;line-height:1.45}
.host label{display:block;font-family:var(--f-caps);font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px}
.host input{width:100%;box-sizing:border-box;font:inherit;font-size:18px;padding:12px 14px;border-radius:4px;border:1px solid rgba(184,145,74,.5);background:var(--paper-hi);color:var(--ink)}
.host input:focus{outline:2px solid var(--gold);outline-offset:1px}
.host .out{margin:12px 0;padding:10px 12px;background:var(--paper);border-radius:4px;font-size:15px;word-break:break-all;user-select:all}
.host .row{display:flex;flex-wrap:wrap;gap:10px}

.music{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:8;width:46px;height:46px;border-radius:50%;
  border:1px solid rgba(184,145,74,.6);background:rgba(255,253,248,.92);color:var(--gold);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 12px rgba(90,65,25,.2)}
.music svg{width:20px;height:20px;fill:currentColor}
.music.playing svg{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01s!important;transition-delay:0s!important}
}
</style>

</head>
<body>
<div class="stage" id="stage">
  <div class="forline" id="forline" hidden>Specially for<b id="forName"></b></div>
  <div class="env" id="env">
    <div class="base"><div class="beam"></div><svg id="sides" viewBox="0 0 360 640" preserveAspectRatio="none" aria-hidden="true"></svg></div>
    <div class="flapwrap top"><div class="flap"><svg id="topArt" viewBox="0 0 360 640" preserveAspectRatio="none" aria-hidden="true"></svg></div></div>
    <div class="flapwrap bot"><div class="flap"><svg id="botArt" viewBox="0 0 360 640" preserveAspectRatio="none" aria-hidden="true"></svg></div></div>
    <button class="seal" id="seal" aria-label="Open the invitation"><span class="pulse"></span><span class="half l"></span><span class="half r"></span><span class="mono" id="sealText">A&amp;H</span></button>
  </div>
  <div class="hint"><i></i>Tap the seal to open<i></i></div>
</div>
<div class="flash" id="flash"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<main class="invite" id="invite">
  <article class="card" id="card"></article>
  <section class="host" id="host" hidden></section>
</main>

<button class="music" id="music" type="button" aria-label="Play music" hidden><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13a3 3 0 1 1-2-2.83V6.3L11 7.6V18a3 3 0 1 1-2-2.83z"/></svg></button>

<script>
/* ===================== EDIT YOUR DETAILS HERE ===================== */
const WEDDING = {
  initials: "A&H",
  bride: "Ayesha",
  groom: "Hamza",
  bismillah: "بسم اللہ الرحمن الرحیم",              // "" to hide
  parents: "With the blessings of Mr. & Mrs. Ahmed and Mr. & Mrs. Khan",
  lead: "request the pleasure of your company to celebrate the wedding of their beloved children",
  mainDate: "2026-12-19T19:00:00+05:00",               // big date + countdown
  events: [
    { name: "Mehndi", start: "2026-12-17T19:00:00+05:00", hours: 4, venue: "Family Residence, Wah Cantt",      map: "https://maps.google.com/?q=Wah+Cantt" },
    { name: "Baraat", start: "2026-12-19T19:00:00+05:00", hours: 4, venue: "Grand Marquee, G.T. Road, Taxila", map: "https://maps.google.com/?q=Taxila" },
    { name: "Walima", start: "2026-12-21T20:00:00+05:00", hours: 3, venue: "Royal Banquet Hall, Islamabad",    map: "https://maps.google.com/?q=Islamabad" }
  ],
  rsvpWhatsApp: "",        // host number with country code, digits only, e.g. "923001234567" ("" hides RSVP)
  music: "",               // e.g. "music.mp3" placed next to index.html ("" hides the music button)
  siteUrl: "https://vareeshashakeel.github.io/wedding/",             // your live link, e.g. "https://yourname.github.io/wedding/" (blank = current page)
  closing: "Your presence and prayers will be our greatest gift.",
  signedBy: "With love, both families"
};
/* ================================================================== */

const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---- guest name from link: ...#Uncle-Akram ---- */
const rawHash = decodeURIComponent((location.hash || "").slice(1));
const hostMode = rawHash.toLowerCase() === "send";
const guest = !hostMode && rawHash ? rawHash.replace(/[-_+]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 40) : "";
if (guest){ $("forline").hidden = false; $("forName").textContent = guest; }

/* ---- embossed envelope art ---- */
function addEmboss(svg){
  const defs = svgEl("defs", {}, svg);
  const f = svgEl("filter", { id: svg.id + "E", x: "-20%", y: "-20%", width: "140%", height: "140%" }, defs);
  svgEl("feDropShadow", { dx: 0, dy: 1.1, stdDeviation: .5, "flood-color": "#ffffff", "flood-opacity": 1 }, f);
  svgEl("feDropShadow", { dx: 0, dy: -.9, stdDeviation: .6, "flood-color": "#a08a62", "flood-opacity": .55 }, f);
  return svgEl("g", { filter: `url(#${svg.id}E)`, fill: "#f8f3e9", stroke: "#e9dfcc", "stroke-width": .5 }, svg);
}
function flower(g, x, y, r, petals = 6, rot = 0){
  for (let i = 0; i < petals; i++) svgEl("ellipse", { cx: x, cy: y - r * .55, rx: r * .32, ry: r * .55, transform: `rotate(${rot + i * 360 / petals} ${x} ${y})` }, g);
  svgEl("circle", { cx: x, cy: y, r: r * .22 }, g);
}
function leaf(g, x, y, len, ang){ svgEl("path", { d: `M0 0 Q ${len*.5} ${-len*.28} ${len} 0 Q ${len*.5} ${len*.28} 0 0Z`, transform: `translate(${x} ${y}) rotate(${ang})` }, g); }
function vine(g, x0, y0, x1, y1, bend, n, side){
  const mx = (x0+x1)/2 + bend, my = (y0+y1)/2;
  svgEl("path", { d: `M${x0} ${y0} Q ${mx} ${my} ${x1} ${y1}`, fill: "none", "stroke-width": 1.6, stroke: "#efe6d4" }, g);
  for (let i = 1; i < n; i++){
    const t = i / n, x = (1-t)*(1-t)*x0 + 2*(1-t)*t*mx + t*t*x1, y = (1-t)*(1-t)*y0 + 2*(1-t)*t*my + t*t*y1, s = i % 2 ? 1 : -1;
    leaf(g, x, y, 13, (side > 0 ? 0 : 180) + s * 40 - 90);
    if (i % 3 === 0) flower(g, x + s * 11, y, 7, 5, i * 20);
    else if (i % 3 === 1) svgEl("circle", { cx: x - s * 9, cy: y - 6, r: 2.4 }, g);
  }
}
function bouquet(g, cx, cy, dir){
  flower(g, cx, cy, 15, 8); flower(g, cx - 30, cy - dir*6, 9, 6, 15); flower(g, cx + 30, cy - dir*6, 9, 6, 15);
  for (const [dx, a] of [[-14,-150],[14,-30],[-46,180],[46,0],[-22,dir>0?-120:120],[22,dir>0?-60:60]]) leaf(g, cx + dx, cy - dir*2, 18, a);
  for (let i = -3; i <= 3; i++) svgEl("circle", { cx: cx + i * 11, cy: cy - dir * (26 - Math.abs(i) * 3), r: 1.8 }, g);
}
const sides = addEmboss($("sides"));
vine(sides, 22, 120, 30, 520, 40, 12, 1); vine(sides, 338, 120, 330, 520, -40, 12, -1);
const topG = addEmboss($("topArt"));
bouquet(topG, 180, 70, -1); vine(topG, 120, 70, 60, 30, -10, 4, -1); vine(topG, 240, 70, 300, 30, 10, 4, 1);
const botG = addEmboss($("botArt"));
bouquet(botG, 180, 560, 1); vine(botG, 120, 560, 60, 600, 10, 4, -1); vine(botG, 240, 560, 300, 600, -10, 4, 1);
$("sealText").textContent = WEDDING.initials;
for (const [l, t, d] of [[18,38,0],[78,30,.9],[30,62,1.6],[70,66,.4],[50,24,2.1]]){
  const s = document.createElement("span"); s.className = "sparkle"; s.style.cssText = `left:${l}%;top:${t}%;animation-delay:${d}s`; $("env").querySelector(".base").appendChild(s);
}

/* ---- build the card ---- */
const main = new Date(WEDDING.mainDate);
const fmtD = (d, o) => d.toLocaleDateString("en-GB", { timeZone: "Asia/Karachi", ...o });
const fmtT = d => d.toLocaleTimeString("en-US", { timeZone: "Asia/Karachi", hour: "numeric", minute: "2-digit" });
const gcal = e => {
  const s = new Date(e.start), end = new Date(s.getTime() + (e.hours || 3) * 3600e3);
  const z = d => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(`${e.name} · ${WEDDING.bride} & ${WEDDING.groom}`) +
    "&dates=" + z(s) + "/" + z(end) + "&location=" + encodeURIComponent(e.venue);
};
const ornament = `<svg class="ornament" viewBox="0 0 220 30" aria-hidden="true"><path d="M10 15 H85 M135 15 H210" stroke="#b8914a" stroke-width=".8"/><path d="M110 4 C118 10 118 20 110 26 C102 20 102 10 110 4Z" fill="none" stroke="#b8914a"/><circle cx="110" cy="15" r="2.2" fill="#b8914a"/><circle cx="92" cy="15" r="1.6" fill="#b8914a"/><circle cx="128" cy="15" r="1.6" fill="#b8914a"/></svg>`;
const waIcon = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.8-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.7a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>`;
let n = 0; const rv = () => `class="rv" style="--d:${(n++ * .12).toFixed(2)}s"`;
const rsvpText = encodeURIComponent(`Assalam o Alaikum! ${guest ? guest + " here — " : ""}I'm delighted to confirm attendance at ${WEDDING.bride} & ${WEDDING.groom}'s wedding. 💐`);
$("card").innerHTML = `
  <div ${rv()}>${ornament}</div>
  ${guest ? `<p class="dear" ${rv()}>Dear ${esc(guest)},</p>` : ""}
  ${WEDDING.bismillah ? `<p class="bismillah" lang="ur" ${rv()}>${WEDDING.bismillah}</p>` : ""}
  <p class="parents" ${rv()}>${WEDDING.parents}</p>
  <p class="lead" ${rv()}>${WEDDING.lead}</p>
  <h1 class="names" ${rv()}>${WEDDING.bride}<span class="amp">&amp;</span>${WEDDING.groom}</h1>
  <div ${rv()}><div class="date"><span class="side">${fmtD(main, { weekday: "long" })}</span><span class="day">${fmtD(main, { day: "2-digit" })}</span><span class="side">${fmtD(main, { month: "long" })}</span></div>
  <div class="year">${fmtD(main, { year: "numeric" })}</div></div>
  <div ${rv()}><div class="count"><div><b id="cd">00</b><small>Days</small></div><div><b id="ch">00</b><small>Hours</small></div><div><b id="cm">00</b><small>Mins</small></div><div><b id="cs">00</b><small>Secs</small></div></div>
  <p class="count-label" id="countLabel">until we celebrate</p></div>
  <div class="rule" ${rv()}>❦</div>
  <p class="eyebrow" ${rv()}>The celebrations</p>
  <div class="events">${WEDDING.events.map(e => { const s = new Date(e.start); return `
    <section class="event" ${rv()}><h3>${e.name}</h3><p class="when">${fmtD(s, { weekday: "long", day: "numeric", month: "long" })} · <span style="white-space:nowrap">${fmtT(s)}</span></p><p class="where">${e.venue}</p>
    <div class="links">${e.map ? `<a href="${e.map}" target="_blank" rel="noopener">Location</a>` : ""}<a href="${gcal(e)}" target="_blank" rel="noopener">Add to calendar</a></div></section>`; }).join("")}
  </div>
  ${WEDDING.rsvpWhatsApp ? `<div class="rule" ${rv()}>❦</div><div class="rsvp" ${rv()}><p>Kindly let us know you'll be joining</p>
    <a class="btn wa" href="https://wa.me/${WEDDING.rsvpWhatsApp}?text=${rsvpText}" target="_blank" rel="noopener">${waIcon}RSVP on WhatsApp</a></div>` : ""}
  <p class="closing" ${rv()}>${WEDDING.closing}<span class="sign">${WEDDING.signedBy}</span></p>
  <div ${rv()}>${ornament}</div>
  <div class="actions" ${rv()}><button class="btn ghost" id="replay" type="button">↺ Open again</button></div>`;

/* ---- countdown ---- */
const pad = x => String(x).padStart(2, "0");
function tick(){
  let ms = main - Date.now();
  if (ms <= 0){ $("countLabel").textContent = "The celebration has begun"; ms = 0; }
  const s = Math.floor(ms / 1000);
  $("cd").textContent = pad(Math.floor(s / 86400)); $("ch").textContent = pad(Math.floor(s % 86400 / 3600));
  $("cm").textContent = pad(Math.floor(s % 3600 / 60)); $("cs").textContent = pad(s % 60);
}
tick(); setInterval(tick, 1000);

/* ---- host panel: personal link per guest ---- */
const base = () => (WEDDING.siteUrl || (location.origin + location.pathname));
if (hostMode){
  const h = $("host"); h.hidden = false;
  h.innerHTML = `<h2>Send personal invites</h2>
    <p>Type a guest's name. Their invite will open with “Specially for …” and greet them by name.</p>
    <label for="gname">Guest name</label><input id="gname" placeholder="e.g. Khala Nusrat" autocomplete="off">
    <div class="out" id="gout"></div>
    <div class="row"><a class="btn wa" id="gwa" target="_blank" rel="noopener">${waIcon}Send on WhatsApp</a><button class="btn ghost" id="gcopy" type="button">Copy link</button></div>`;
  const upd = () => {
    const nm = $("gname").value.trim(), link = base() + (nm ? "#" + nm.replace(/\s+/g, "-") : "");
    $("gout").textContent = link;
    const msg = `Assalam o Alaikum${nm ? " " + nm : ""}! 💌\nWith great joy we invite you to the wedding of ${WEDDING.bride} & ${WEDDING.groom}.\nOpen your invitation 👇\n${link}`;
    $("gwa").href = "https://wa.me/?text=" + encodeURIComponent(msg);
  };
  $("gname").addEventListener("input", upd); upd();
  $("gcopy").addEventListener("click", e => {
    const t = $("gout").textContent;
    navigator.clipboard.writeText(t).then(() => { e.target.textContent = "Copied"; setTimeout(() => e.target.textContent = "Copy link", 1600); })
      .catch(() => { const r = document.createRange(); r.selectNodeContents($("gout")); getSelection().removeAllRanges(); getSelection().addRange(r); });
  });
}

/* ---- music (optional) ---- */
let audio = null;
if (WEDDING.music){
  audio = new Audio(WEDDING.music); audio.loop = true; $("music").hidden = false;
  $("music").addEventListener("click", () => { audio.paused ? audio.play().catch(()=>{}) : audio.pause(); });
  audio.addEventListener("play", () => $("music").classList.add("playing"));
  audio.addEventListener("pause", () => $("music").classList.remove("playing"));
}

/* ---- petals + gold dust ---- */
const cv = $("fx"), cx = cv.getContext("2d"); let W = 0, H = 0, parts = [], running = false;
const size = () => { const r = devicePixelRatio || 1; W = cv.width = innerWidth * r; H = cv.height = innerHeight * r; };
size(); addEventListener("resize", size);
const petalCols = ["#f3c9c3", "#f7dcd4", "#efb7b0", "#fbe7df", "#e9c77b"];
function burst(count){
  const r = devicePixelRatio || 1;
  for (let i = 0; i < count; i++){
    const gold = Math.random() < .3;
    parts.push({ x: Math.random() * W, y: -Math.random() * H * .6, vy: (1 + Math.random() * 1.6) * r, vx: (Math.random() - .5) * .8 * r,
      s: (gold ? 2 + Math.random() * 2 : 6 + Math.random() * 7) * r, a: Math.random() * 6.3, va: (Math.random() - .5) * .06, w: Math.random() * 6.3, gold,
      c: gold ? "#e2bc6a" : petalCols[i % 4] });
  }
}
function loop(){
  cx.clearRect(0, 0, W, H);
  parts = parts.filter(p => p.y < H + 40);
  for (const p of parts){
    p.w += .03; p.x += p.vx + Math.sin(p.w) * .6; p.y += p.vy; p.a += p.va;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c;
    if (p.gold){ cx.globalAlpha = .8; cx.beginPath(); cx.arc(0, 0, p.s / 2, 0, 7); cx.fill(); }
    else { cx.scale(1, .55 + .45 * Math.abs(Math.sin(p.w))); cx.beginPath(); cx.moveTo(0, -p.s); cx.bezierCurveTo(p.s, -p.s * .6, p.s * .7, p.s * .6, 0, p.s); cx.bezierCurveTo(-p.s * .7, p.s * .6, -p.s, -p.s * .6, 0, -p.s); cx.globalAlpha = .9; cx.fill(); }
    cx.restore();
  }
  if (parts.length) requestAnimationFrame(loop); else running = false;
}
function petals(count){ if (reduced) return; burst(count); if (!running){ running = true; requestAnimationFrame(loop); } }

/* ---- open / replay ---- */
const stage = $("stage"), env = $("env"), invite = $("invite");
document.body.classList.add("locked");
function openIt(){
  if (env.classList.contains("open")) return;
  try { navigator.vibrate && navigator.vibrate([30, 40, 60]); } catch (e) {}
  audio && audio.play().catch(() => {});
  env.classList.add("open"); stage.classList.add("opening"); $("flash").classList.add("on");
  setTimeout(() => petals(70), reduced ? 0 : 700);
  setTimeout(() => {
    stage.classList.add("gone"); invite.classList.add("revealed"); document.body.classList.remove("locked");
    $("flash").classList.remove("on");
  }, reduced ? 50 : 1700);
}
$("seal").addEventListener("click", openIt);
$("replay").addEventListener("click", () => {
  scrollTo(0, 0); invite.classList.remove("revealed"); stage.classList.remove("gone", "opening"); document.body.classList.add("locked"); env.classList.remove("open");
});
if (hostMode) openIt();
</script>

</body>
